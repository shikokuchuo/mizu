# rchk (static PROTECT analysis) and valgrind checks in the r-hub containers,
# which carry the CRAN check configurations:
# https://github.com/r-hub/containers. Derived from the canonical workflow at
# https://github.com/r-hub/actions/blob/v1/workflows/rhub.yaml. At manual
# dispatch, `config` accepts any comma-separated list of R-hub platforms.

name: R-hub

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      config:
        description: 'A comma separated list of R-hub platforms to use.'
        type: string
        default: 'rchk,valgrind'

permissions: read-all

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.rhub-setup.outputs.containers }}
      platforms: ${{ steps.rhub-setup.outputs.platforms }}

    steps:
    # NO NEED TO CHECKOUT HERE
    - uses: r-hub/actions/setup@v1
      id: rhub-setup
      with:
        config: ${{ github.event.inputs.config || 'rchk,valgrind' }}

  containers:
    needs: setup
    if: ${{ needs.setup.outputs.containers != '[]' }}
    runs-on: ubuntu-latest
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.containers) }}
    container:
      image: ${{ matrix.config.container }}
      # Docker's 64MB default /dev/shm is too small for the test suite.
      options: --shm-size=2g

    steps:
      - uses: r-hub/actions/checkout@v1
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/setup-deps@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      # The images lack the quarto CLI, needed to build the vignette at
      # R CMD build. rchk runs its own script on the source tree instead.
      - name: Install Quarto CLI
        if: matrix.config.label != 'rchk'
        run: |
          curl -sLO https://quarto.org/download/latest/quarto-linux-amd64.tar.gz
          mkdir -p /opt/quarto
          tar -xzf quarto-linux-amd64.tar.gz -C /opt/quarto --strip-components=1
          echo "/opt/quarto/bin" >> "$GITHUB_PATH"
      - uses: r-hub/actions/run-check@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}

  other-platforms:
    needs: setup
    if: ${{ needs.setup.outputs.platforms != '[]' }}
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.platforms) }}

    steps:
      - uses: r-hub/actions/checkout@v1
      - uses: r-hub/actions/setup-r@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/setup-deps@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/run-check@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
