# src/vendor/ must always be exactly "pinned upstream + the enumerated
# substitutions": re-run the vendor script against the pinned ref and fail
# on any drift, so hand-edits to vendored files can never land.
on:
  push:
    branches: [main, master]
  pull_request:

name: vendor-drift.yaml

permissions: read-all

jobs:
  vendor-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Re-vendor at the pinned ref
        run: bash tools/vendor-mori.sh

      - name: Fail on drift
        run: git diff --exit-code -- src/vendor
