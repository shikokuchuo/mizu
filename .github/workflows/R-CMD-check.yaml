# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-24.04-arm, r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,    r: 'release'}
          - {os: ubuntu-22.04,     r: 'oldrel-2'}
          - {os: macOS-latest,     r: 'release'}
          - {os: macos-15-intel,   r: 'oldrel-2'}
          - {os: windows-latest,   r: 'release'}
          - {os: windows-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      CROSSLANG_PAT: ${{ secrets.CROSSLANG_PAT }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # The cross-language tests need a python3 with pymizu and NumPy (they
      # probe-skip otherwise). pymizu is a private repo, so these steps
      # need the CROSSLANG_PAT secret (a PAT with read access to pymizu);
      # without it they skip and the tests probe-skip. Skipped on Windows:
      # the helper probes `python3`, which setup-python does not provide
      # there, and pymizu's build forces clang-cl.
      - uses: actions/setup-python@v7
        if: runner.os != 'Windows' && env.CROSSLANG_PAT != ''
        with:
          python-version: "3.13"

      - name: Install pymizu (cross-language tests)
        if: runner.os != 'Windows' && env.CROSSLANG_PAT != ''
        run: pip install git+https://x-access-token:${CROSSLANG_PAT}@github.com/shikokuchuo/pymizu.git numpy

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
