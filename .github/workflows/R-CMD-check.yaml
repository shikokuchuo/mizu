# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        # bench opts a job into the benchmark tests: only runners in the same
        # class as the modern defaults — the legacy VMs (ubuntu-22.04,
        # macos-15-intel) pay parked wake latency above the committed baseline
        config:
          - {os: ubuntu-24.04-arm, r: 'devel', http-user-agent: 'release', bench: true}
          - {os: ubuntu-latest,    r: 'release', bench: true}
          - {os: ubuntu-latest,    r: 'oldrel-1', bench: true}
          - {os: ubuntu-22.04,     r: 'oldrel-2'}
          - {os: macOS-latest,     r: 'release', bench: true}
          - {os: macos-15-intel,   r: 'oldrel-2'}
          - {os: windows-latest,   r: 'release', bench: true}
          - {os: windows-latest,   r: 'oldrel-2', bench: true}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      MOV_BENCH: ${{ matrix.config.bench }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
